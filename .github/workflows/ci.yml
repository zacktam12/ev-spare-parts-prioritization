name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The dependency set includes pywinpty (a Windows-only Jupyter dependency), so
# CI runs on windows-latest to validate the exact requirements.txt that ships
# with the project rather than an approximation of it.
jobs:
  validate:
    name: Pipeline + validation suite
    runs-on: windows-latest
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run end-to-end pipeline
        run: python run_pipeline.py --list; python run_pipeline.py

      - name: Run validation suite
        run: python -m pytest -ra

      - name: Upload generated figures and deck
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-outputs
          path: |
            reports/figures/*.png
            reports/*.pptx
            data/scoring_results.csv
          if-no-files-found: warn
